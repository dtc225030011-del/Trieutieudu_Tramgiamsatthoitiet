name: ESP32 Firmware CI

on:
  push:
    branches: [ main ]
    paths:
      - 'esp32/**'
      - '.github/workflows/esp32-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'esp32/**'
      - '.github/workflows/esp32-ci.yml'

jobs:
  build-esp32:
    name: Build PlatformIO ESP32 Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        working-directory: esp32
        run: |
          pio run
